<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Iris Zhou</title>
    <script src="scripts/init-theme-lang.js"></script>
    <meta name="description" content="Project portfolio by Iris Zhou: AI product explorations, design systems, and practical prototypes with measurable outcomes.">
    <link rel="canonical" href="https://carpediemzzsssww-cpu.github.io/Iris/projects.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Projects - Iris Zhou">
    <meta property="og:description" content="Explore Iris Zhou's featured product and AI projects.">
    <meta property="og:url" content="https://carpediemzzsssww-cpu.github.io/Iris/projects.html">
    <meta property="og:image" content="https://carpediemzzsssww-cpu.github.io/Iris/assets/ai-lab/surreal-butterflies.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Projects - Iris Zhou">
    <meta name="twitter:description" content="Explore Iris Zhou's featured product and AI projects.">
    <meta name="twitter:image" content="https://carpediemzzsssww-cpu.github.io/Iris/assets/ai-lab/surreal-butterflies.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@400;500;700&family=Noto+Serif+SC:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particle-field"></div>

    <!-- Navigation (injected by components.js) -->
    <nav id="site-nav"></nav>
    <div id="site-mobile-drawer"></div>

    <main class="main-content">
        <!-- Page Header -->
        <section class="page-header reveal">
            <div class="container">
                <h1 class="page-title" data-i18n="projects.title">Projects</h1>
                <p class="page-subtitle" data-i18n="projects.subtitle">
                    Designing systems that solve real problems through iteration, research, and human-centered thinking.
                </p>
            </div>
        </section>

        <!-- Toolbar -->
        <section class="toolbar-section">
            <div class="container">
                <div class="toolbar">
                    <div class="toolbar-search">
                        <label class="visually-hidden" for="searchInput">Search projects</label>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search projects..." class="search-input" aria-label="Search projects" data-i18n-placeholder="projects.search">
                    </div>
                    <div class="toolbar-filters">
                        <div class="filter-group">
                            <label class="filter-label">Tags:</label>
                            <div class="tag-filters" id="tagFilters"></div>
                        </div>
                        <div class="filter-group">
                            <label class="filter-label" for="sortSelect" data-i18n="projects.sortLabel">Sort:</label>
                            <select id="sortSelect" class="sort-select">
                                <option value="latest" data-i18n="projects.sortLatest">Latest</option>
                                <option value="impact" data-i18n="projects.sortImpact">Most Impact</option>
                                <option value="technical" data-i18n="projects.sortTechnical">Most Technical</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Projects Grid -->
        <section class="projects-list-section">
            <div class="container">
                <div class="projects-grid" id="allProjectsGrid">
                    <!-- Projects loaded via JavaScript -->
                </div>
                <div class="no-results" id="noResults" style="display: none;">
                    <p data-i18n="projects.noResults">No projects found matching your criteria.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer (injected by components.js) -->
    <footer id="site-footer"></footer>

    <script src="components.js"></script>
    <script src="i18n.js"></script>
    <script>
    window.i18n.loadContent(['projects-ui.json']);
    </script>
    <script src="scripts.js" defer></script>
    <script src="projects.js" defer></script>
    <script src="alter-widget.js" defer></script>
</body>
</html>
