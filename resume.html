<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Iris Zhou</title>
    <script>
    (function () {
        try {
            var stored = localStorage.getItem('themePreference');
            var preference = stored ? JSON.parse(stored) : null;
            var isDark = preference ? preference === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (error) {}
    })();
    </script>
    <script>
    (function () {
        try {
            var lang = localStorage.getItem('langPreference') || 'en';
            document.documentElement.setAttribute('data-lang', lang);
            document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
        } catch (e) {}
    })();
    </script>
    <meta name="description" content="Iris Zhou resume hub with both English and Chinese PDF versions.">
    <link rel="canonical" href="https://carpediemzzsssww-cpu.github.io/Iris/resume.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Resume - Iris Zhou">
    <meta property="og:description" content="View and download both English and Chinese resume PDFs.">

    <meta property="og:image" content="https://carpediemzzsssww-cpu.github.io/Iris/assets/ai-lab/surreal-butterflies.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@400;500;700&family=Noto+Serif+SC:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="particle-field"></div>

    <!-- Navigation (injected by components.js) -->
    <nav id="site-nav"></nav>
    <div id="site-mobile-drawer"></div>

    <main class="main-content">
        <section class="page-header reveal">
            <div class="container">
                <h1 class="page-title" data-i18n="resume.title">Resume</h1>
                <p class="page-subtitle" data-i18n="resume.subtitle">View and download both language versions in one place.</p>
            </div>
        </section>

        <section class="resume-hub-section reveal">
            <div class="container">
                <div class="resume-grid">
                    <article class="learning-card resume-card">
                        <div class="learning-card-header">
                            <h2 class="learning-card-title" data-i18n="resume.enTitle">English Resume</h2>
                            <span class="learning-card-meta" data-i18n="resume.enMeta">EN · PDF</span>
                        </div>
                        <div class="resume-actions">
                            <a href="assets/resume/iris_zhou_resume_en.pdf" class="btn btn-primary" target="_blank" rel="noopener noreferrer" data-i18n="resume.openPdf">Open PDF</a>
                            <a href="assets/resume/iris_zhou_resume_en.pdf" class="btn btn-ghost" download="iris_zhou_resume_en.pdf" data-i18n="resume.download">Download</a>
                        </div>
                        <div class="resume-preview-wrap">
                            <iframe class="resume-preview" src="assets/resume/iris_zhou_resume_en.pdf#view=FitH" title="English resume preview" loading="lazy"></iframe>
                        </div>
                    </article>

                    <article class="learning-card resume-card">
                        <div class="learning-card-header">
                            <h2 class="learning-card-title" data-i18n="resume.zhTitle">Chinese Resume</h2>
                            <span class="learning-card-meta" data-i18n="resume.zhMeta">CN · PDF</span>
                        </div>
                        <div class="resume-actions">
                            <a href="assets/resume/iris_zhou_resume_cn.pdf" class="btn btn-primary" target="_blank" rel="noopener noreferrer" data-i18n="resume.zhOpenPdf">Open PDF</a>
                            <a href="assets/resume/iris_zhou_resume_cn.pdf" class="btn btn-ghost" download="iris_zhou_resume_cn.pdf" data-i18n="resume.zhDownload">Download</a>
                        </div>
                        <div class="resume-preview-wrap">
                            <iframe class="resume-preview" src="assets/resume/iris_zhou_resume_cn.pdf#view=FitH" title="Chinese resume preview" loading="lazy"></iframe>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer (injected by components.js) -->
    <footer id="site-footer"></footer>

    <script src="components.js"></script>

    window.i18n.loadContent(['resume.json']);
